<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hostel Manager - Login</title>
    <link rel="stylesheet" href="../css/student.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="role-page">
    <main class="role-container">
        <section class="role-intro">
            <div class="brand-mark" aria-hidden="true">
                <i class="fa-solid fa-building-columns"></i>
            </div>
            <p class="eyebrow">Hostel Manager</p>
            <h1>Welcome back.</h1>
            <p class="intro-copy">Choose your portal to continue managing hostel life.</p>
        </section>

        <section class="role-options" aria-labelledby="portal-heading">
            <h2 id="portal-heading">Sign in as</h2>
            <div class="role-grid">
                <a class="role-card student-card" href="../student/studentlogin.html">
                    <span class="role-icon" aria-hidden="true"><i class="fa-solid fa-user-graduate"></i></span>
                    <span class="role-card-content">
                        <strong>Student Login</strong>
                        <small>Access your room, mess and complaints</small>
                    </span>
                    <i class="fa-solid fa-arrow-right role-arrow" aria-hidden="true"></i>
                </a>
                <a class="role-card warden-card" href="../staff/staffLogin.html">
                    <span class="role-icon" aria-hidden="true"><i class="fa-solid fa-shield-halved"></i></span>
                    <span class="role-card-content">
                        <strong>Warden Login</strong>
                        <small>Manage residents, rooms and requests</small>
                    </span>
                    <i class="fa-solid fa-arrow-right role-arrow" aria-hidden="true"></i>
                </a>
            </div>
        </section>

        <p class="role-footer"><i class="fa-solid fa-lock" aria-hidden="true"></i> Secure access for hostel residents and staff</p>
    </main>
</body>
</html>
