<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Hostel Manager - Warden Login</title>
	<link rel="stylesheet" href="../css/student.css">
	<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="student-page">
	<main class="student-shell">
		<section class="student-login" id="warden-login">
			<div class="login-header">
				<i class="fa-solid fa-shield-halved logo-icon"></i>
				<p class="eyebrow">Hostel Manager</p>
				<h1>Warden Login</h1>
				<p>Sign in to manage residents, rooms and requests.</p>
			</div>

			<form class="login-form" id="warden-login-form">
				<div class="input-group">
					<label for="warden-email">Email address</label>
					<div class="input-field">
						<i class="fa-solid fa-envelope icon" aria-hidden="true"></i>
						<input type="email" id="warden-email" placeholder="warden@hostel.com" required>
					</div>
				</div>
				<div class="input-group">
					<label for="warden-password">Password</label>
					<div class="input-field">
						<i class="fa-solid fa-lock icon" aria-hidden="true"></i>
						<input type="password" id="warden-password" placeholder="Enter your password" required>
					</div>
				</div>
				<div class="form-options">
					<label class="remember-me"><input type="checkbox"> Remember me</label>
					<a href="#" class="forgot-pass">Forgot password?</a>
				</div>
				<button type="submit" class="btn-login">Login to dashboard</button>
			</form>
			<div class="login-footer"><a href="../loginPage/login.html">Back to portal selection</a></div>
		</section>
	</main>
</body>
</html>
