<!DOCTYPE html>
<html lang="en">

<head>

	<meta charset="UTF-8">

	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title>Hostel Management - Warden Login</title>

	<link rel="stylesheet" href="../css/student.css">

	<link
		href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
		rel="stylesheet">

	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

</head>

<body>

	<div class="login-container">

		<div class="login-header">

			<i class="fa-solid fa-shield-halved logo-icon" aria-hidden="true"></i>

			<h2>
				Warden Portal
			</h2>

			<p>
				Sign in to manage residents, rooms and requests
			</p>

		</div>


		<form id="warden-login-form" class="login-form">

			<div class="input-group">

				<label for="warden-email">
					Email address
				</label>

				<div class="input-field">

					<i class="fa-solid fa-envelope icon" aria-hidden="true"></i>

					<input type="email" id="warden-email" placeholder="warden@hostel.com" required>

				</div>

			</div>


			<div class="input-group">

				<label for="warden-password">
					Password
				</label>

				<div class="input-field">

					<i class="fa-solid fa-lock icon" aria-hidden="true"></i>

					<input type="password" id="warden-password" placeholder="Enter your password" required>

				</div>

			</div>


			<div class="form-options">

				<label class="remember-me">

					<input type="checkbox" id="warden-remember-me">

					Remember me

				</label>


				<a href="#" class="forgot-pass" onclick="return false;">
					Forgot Password?
				</a>

			</div>


			<button type="submit" class="btn-login" id="warden-login-button">
				Login to Portal
			</button>

		</form>


		<div class="login-footer">

			<p>

				<a href="../loginPage/login.html">
					Back to portal selection
				</a>

			</p>

		</div>

	</div>


	<script src="../js/api.js"></script>


	<script>

		const wardenLoginForm =
			document.getElementById(
				"warden-login-form"
			);


		const wardenLoginButton =
			document.getElementById(
				"warden-login-button"
			);


		wardenLoginForm.addEventListener(
			"submit",
			async function (event) {

				event.preventDefault();

				event.stopPropagation();


				const email =
					document
						.getElementById(
							"warden-email"
						)
						.value
						.trim();


				const password =
					document
						.getElementById(
							"warden-password"
						)
						.value;


				if (!email || !password) {

					alert(
						"Please enter your email and password."
					);

					return;

				}


				wardenLoginButton.disabled =
					true;


				wardenLoginButton.textContent =
					"Logging in...";


				try {

					const data =
						await login(
							email,
							password
						);


					if (
						!data.user ||
						data.user.role !== "warden"
					) {

						throw new Error(
							"This account is not a warden account."
						);

					}


					window.location.href =
						"staff.html";


				}
				catch (error) {

					console.error(
						"Warden login error:",
						error
					);


					alert(
						error.message
					);

				}
				finally {

					wardenLoginButton.disabled =
						false;


					wardenLoginButton.textContent =
						"Login to Portal";

				}

			}
		);

	</script>

</body>

</html>
