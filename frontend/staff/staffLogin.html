<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Hostel Management - Warden Login</title>
	<link rel="stylesheet" href="../css/student.css">
	<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
	<div class="login-container">
		<div class="login-header">
			<i class="fa-solid fa-shield-halved logo-icon"></i>
			<h2>Warden Portal</h2>
			<p>Sign in to manage residents, rooms and requests</p>
		</div>

		<form action="#" method="POST" class="login-form">
			<div class="input-group">
				<label for="warden-email">Email address</label>
				<div class="input-field">
					<i class="fa-solid fa-envelope icon"></i>
					<input type="email" id="warden-email" placeholder="warden@hostel.com" required>
				</div>
			</div>

			<div class="input-group">
				<label for="password">Password</label>
				<div class="input-field">
					<i class="fa-solid fa-lock icon"></i>
					<input type="password" id="password" placeholder="Enter your password" required>
				</div>
			</div>

			<div class="form-options">
				<label class="remember-me">
					<input type="checkbox"> Remember me
				</label>
				<a href="#" class="forgot-pass">Forgot Password?</a>
			</div>

			<button type="submit" class="btn-login">Login to Portal</button>
		</form>

		<div class="login-footer">
			<p><a href="../loginPage/login.html">Back to portal selection</a></p>
		</div>
	</div>
</body>
</html>
