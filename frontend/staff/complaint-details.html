<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complaint Details | Hostel Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --ink: #17202a; --muted: #697586; --paper: #f7f8f5; --line: #dfe5e4; --teal: #087f8c; --coral: #d96b4f; --green: #3d8063; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; color: var(--ink); background: #173b42; font-family: 'DM Sans', sans-serif; }
        .page { width: min(100% - 40px, 760px); margin: 0 auto; padding: 54px 0; }
        .back { display: inline-block; margin-bottom: 20px; color: #dce9e6; text-decoration: none; font-weight: 600; }
        .back:hover { color: #fff; text-decoration: underline; }
        .card { overflow: hidden; background: var(--paper); border-radius: 18px; box-shadow: 0 22px 50px rgba(7, 28, 32, .24); }
        .header { padding: 28px 32px; color: #fff; background: #1c4c52; }
        .eyebrow { margin: 0 0 8px; color: #b9ccca; font-size: .78rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
        h1 { margin: 0; font: 700 clamp(1.7rem, 4vw, 2.6rem) 'Space Grotesk', sans-serif; }
        .body { padding: 32px; }
        .student { display: flex; justify-content: space-between; gap: 20px; align-items: start; padding-bottom: 26px; border-bottom: 1px solid var(--line); }
        .student h2 { margin: 0 0 6px; font: 700 1.35rem 'Space Grotesk', sans-serif; }
        .student p { margin: 0; color: var(--muted); }
        .room { padding: 14px 18px; color: var(--teal); background: #e4f2f0; border-radius: 8px; text-align: right; white-space: nowrap; }
        .room strong { display: block; font: 700 1.25rem 'Space Grotesk', sans-serif; }
        .room span { font-size: .75rem; }
        dl { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin: 26px 0; }
        dt { margin-bottom: 5px; color: var(--muted); font-size: .75rem; font-weight: 700; text-transform: uppercase; }
        dd { margin: 0; font-weight: 600; }
        .description { padding-top: 22px; border-top: 1px solid var(--line); }
        .description h3 { margin: 0 0 9px; font: 700 1rem 'Space Grotesk', sans-serif; }
        .description p { margin: 0; line-height: 1.6; white-space: pre-wrap; }
        .status { color: var(--teal); } .status.resolved { color: var(--green); } .status.pending { color: var(--coral); }
        .message { padding: 24px; color: var(--muted); text-align: center; }
        .error { color: var(--coral); }
        @media (max-width: 560px) { .page { width: min(100% - 24px, 760px); padding-top: 28px; } .header, .body { padding: 22px 18px; } .student { flex-direction: column; } .room { width: 100%; text-align: left; } dl { grid-template-columns: 1fr; gap: 16px; } }
    </style>
</head>
<body>
    <main class="page">
        <a class="back" href="staff.html">&larr; Back to complaints</a>
        <section class="card" id="details-card">
            <header class="header"><p class="eyebrow">Complaint details</p><h1>Loading...</h1></header>
            <div class="message">Loading complaint information...</div>
        </section>
    </main>
    <script>
        function escapeHtml(value) { return String(value ?? '').replace(/[&<>'"]/g, (character) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[character])); }
        function formatDate(value) { return value ? new Date(value).toLocaleString() : 'Not resolved'; }
        async function loadDetails() {
            const complaintId = new URLSearchParams(window.location.search).get('id');
            if (!complaintId) throw new Error('Complaint ID is missing');
            const response = await fetch(`/api/warden/complaints/${encodeURIComponent(complaintId)}`, { credentials: 'include' });
            const data = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(data.error || 'Unable to load complaint');
            const complaint = data.complaint;
            document.querySelector('.header h1').textContent = complaint.title;
            document.querySelector('.message').outerHTML = `<div class="body"><div class="student"><div><p class="eyebrow">Reported by</p><h2>${escapeHtml(complaint.student_name)}</h2><p>${escapeHtml(complaint.student_email)}</p></div><div class="room"><span>Room</span><strong>${escapeHtml(complaint.room_number)}</strong><span>${escapeHtml(complaint.hostel_block)}</span></div></div><dl><div><dt>Complaint ID</dt><dd>${escapeHtml(complaint.complaint_id)}</dd></div><div><dt>Category</dt><dd>${escapeHtml(complaint.category)}</dd></div><div><dt>Priority</dt><dd>${escapeHtml(complaint.priority)}</dd></div><div><dt>Status</dt><dd class="status ${complaint.status.toLowerCase().replace(' ', '-')}">${escapeHtml(complaint.status)}</dd></div><div><dt>Created</dt><dd>${formatDate(complaint.created_at)}</dd></div><div><dt>Last updated</dt><dd>${formatDate(complaint.updated_at)}</dd></div></dl><div class="description"><h3>Description</h3><p>${escapeHtml(complaint.description)}</p></div></div>`;
        }
        loadDetails().catch((error) => { document.querySelector('.header h1').textContent = 'Unable to load'; document.querySelector('.message').innerHTML = `<span class="error">${escapeHtml(error.message)}. Please log in again.</span>`; });
    </script>
</body>
</html>
