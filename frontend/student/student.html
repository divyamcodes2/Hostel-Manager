<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Hostel Manager - Student Dashboard</title>
	<link rel="stylesheet" href="../css/student.css">
	<link
		href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
		rel="stylesheet">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="student-page">
	<main class="student-shell">
		<section class="student-dashboard" id="student-dashboard">
			<header class="dashboard-header">
				<div>
					<p class="eyebrow">Student dashboard</p>
					<h1 id="student-greeting">Good morning.</h1>
				</div>
				<a class="logout-button" href="studentlogin.html">Log out</a>
			</header>

			<div class="dashboard-layout">
				<aside class="profile-panel">
					<div class="avatar" aria-hidden="true">AS</div>
					<p class="eyebrow">Your profile</p>
					<h2 id="student-name">Student</h2>
					<dl class="profile-details">
						<div>
							<dt>Student name</dt>
							<dd>Alex Sharma</dd>
						</div>
						<div>
							<dt>Room number</dt>
							<dd id="student-room">-</dd>
						</div>

						<div>
							<dt>Student ID</dt>
							<dd id="student-id">-</dd>
						</div>
					</dl>
				</aside>

				<div class="dashboard-main">
					<section class="dashboard-card complaint-card">
						<div class="card-heading">
							<div>
								<p class="eyebrow">Need help?</p>
								<h2>Enter your complaint</h2>
							</div>
							<i class="fa-regular fa-message card-icon" aria-hidden="true"></i>
						</div>
						<form id="complaint-form">

							<label for="complaint-category">Category</label>
							<select id="complaint-category" required>
								<option value="">Select category</option>
								<option value="Room">Room</option>
								<option value="Water">Water</option>
								<option value="Electricity">Electricity</option>
								<option value="Food">Food</option>
								<option value="Cleanliness">Cleanliness</option>
								<option value="Other">Other</option>
							</select>

							<label for="complaint-title">Title</label>
							<input type="text" id="complaint-title" placeholder="Short description of the problem"
								required>

							<label for="complaint">Describe the issue</label>
							<textarea id="complaint" rows="5" placeholder="Tell the warden what needs attention..."
								required></textarea>

							<button class="btn-login" type="submit">
								Submit complaint
							</button>

						</form>
					</section>

					<section class="dashboard-card status-card">
						<div class="card-heading">
							<div>
								<p class="eyebrow">Stay informed</p>
								<h2>Check complaint status</h2>
							</div>
							<i class="fa-solid fa-list-check card-icon" aria-hidden="true"></i>
						</div>
						<div class="status-row"><span>Water tap repair</span><strong
								class="status-badge pending">Pending</strong></div>
						<div class="status-row"><span>Room light replacement</span><strong
								class="status-badge resolved">Resolved</strong></div>
					</section>
				</div>
			</div>
		</section>
	</main>
	<script src="../js/api.js"></script>

	<script>

		const loginForm = document.getElementById("student-login-form");
		const loginPanel = document.getElementById("student-login");
		const dashboard = document.getElementById("student-dashboard");

		const logoutButton = document.getElementById("student-logout");


		// =========================
		// LOGIN
		// =========================

		loginForm.addEventListener("submit", async function (event) {

			event.preventDefault();

			const email = document.getElementById("student-email").value;
			const password = document.getElementById("student-password").value;

			try {

				const data = await login(email, password);

				console.log("Login successful:", data);

				loginPanel.hidden = true;
				dashboard.hidden = false;

				loadStudentDashboard();

			} catch (error) {

				alert(error.message);

			}

		});


		// =========================
		// LOAD STUDENT DASHBOARD
		// =========================

		async function loadStudentDashboard() {

			try {

				const data = await getCurrentUser();

				const user = data.user;

				console.log("Current user:", user);

				document.getElementById("student-name").textContent = user.name;

				document.getElementById("student-greeting").textContent =
					`Good morning, ${user.name}.`;

				document.getElementById("student-id").textContent =
					user.id;

				loadComplaints();

			} catch (error) {

				console.error(error);

				loginPanel.hidden = false;
				dashboard.hidden = true;

			}

		}


		// =========================
		// LOAD COMPLAINTS
		// =========================

		async function loadComplaints() {

			try {

				const data = await getMyComplaints();

				console.log("Complaints:", data);

				const container = document.querySelector(".status-card");

				// Keep the heading
				const heading = container.querySelector(".card-heading");

				container.innerHTML = "";

				container.appendChild(heading);

				if (data.complaints.length === 0) {

					const message = document.createElement("p");

					message.textContent = "No complaints submitted yet.";

					container.appendChild(message);

					return;
				}


				data.complaints.forEach(function (complaint) {

					const row = document.createElement("div");

					row.className = "status-row";

					row.innerHTML = `
                <span>
                    ${complaint.title}
                </span>

                <strong class="status-badge ${complaint.status.toLowerCase()}">
                    ${complaint.status}
                </strong>
            `;

					container.appendChild(row);

				});

			} catch (error) {

				console.error("Failed to load complaints:", error);

			}

		}


		// =========================
		// SUBMIT COMPLAINT
		// =========================

		const complaintForm = document.getElementById("complaint-form");

		complaintForm.addEventListener("submit", async function (event) {

			event.preventDefault();

			const category =
				document.getElementById("complaint-category").value;

			const title =
				document.getElementById("complaint-title").value;

			const description =
				document.getElementById("complaint").value;


			try {

				const data = await createComplaint(
					category,
					title,
					description
				);

				alert("Complaint submitted successfully!");

				console.log("Created complaint:", data);

				complaintForm.reset();

				loadComplaints();

			} catch (error) {

				alert(error.message);

			}

		});


		// =========================
		// LOGOUT
		// =========================

		logoutButton.addEventListener("click", async function () {

			try {

				await logout();

				dashboard.hidden = true;
				loginPanel.hidden = false;

				loginForm.reset();

			} catch (error) {

				alert(error.message);

			}

		});

	</script>
</body>

</html>
